title: "TEOTECH · Diplomado agéntico"
description: "Nivelación agéntica del Diplomado en Transformación Digital · Instituto Luterano Latinoamericano · CC BY-NC-SA 4.0"
remote_theme: yaeleureka-afk/teotech-theme
plugins:
  - jekyll-remote-theme
teotech:
  handle: neuromitosis/teotech
  tutor: true
  footer: "æ://neuromitosis/teotech · #OpenCourseWare 🏵️ · Se multiplica la enseñanza. El humano conserva el criterio."
  dock:
    - {label: "INICIO", icon: "⌂", url: "/"}
    - {label: "CLASES", icon: "≡", url: "/clases/"}
    - {label: "INSTALAR", icon: ">_", url: "/instalar/"}
lang: es
timezone: America/Chicago

collections:
  clases:
    output: true
    permalink: /clases/:name/

exclude:
  - AGENTS.md
  - CHANGELOG.md
  - _src
  - hermes/config.example.yaml
  - hermes/env.example
